# HoopSync Configuration

# Video Capture Settings
video_capture:
  device_index: 0  # Elgato HD60 X device index
  width: 1920
  height: 1080
  fps: 30
  buffer_size: 10

# Frame Detection Settings
frame_detector:
  confidence_threshold: 0.75
  model_path: "models/screen_detector.pth"
  screen_types:
    - scoreboard
    - box_score
    - player_stats
    - team_stats
    - matchup_screen
    - player_card
    - player_attributes
    - shot_info
    - game_summary
    - final_results

# ROI Extraction Settings
roi_extractor:
  # Define regions for each screen type
  scoreboard:
    player_name: [100, 200, 300, 50]
    points: [350, 200, 100, 50]
    rebounds: [460, 200, 100, 50]
    assists: [570, 200, 100, 50]
  
  box_score:
    player_name: [50, 100, 200, 40]
    fg: [260, 100, 80, 40]
    three_pt: [350, 100, 80, 40]
    ft: [440, 100, 80, 40]
    pts: [530, 100, 60, 40]
    reb: [600, 100, 60, 40]
    ast: [670, 100, 60, 40]
    stl: [740, 100, 60, 40]
    blk: [810, 100, 60, 40]
    tov: [880, 100, 60, 40]

# OCR Settings
ocr:
  engine: "tesseract"
  language: "eng"
  confidence_threshold: 0.7
  preprocessing:
    grayscale: true
    threshold: true
    denoise: true

# Database Settings
database:
  type: "sqlite"
  path: "data/hoopsync.db"
  pool_size: 5

# Deduplication Settings
deduplication:
  time_window_seconds: 5  # Consider same event if within 5 seconds
  similarity_threshold: 0.95

# Dashboard Settings
dashboard:
  host: "127.0.0.1"
  port: 8080
  refresh_rate_ms: 1000

# Cloud API Settings
cloud:
  enabled: false
  api_endpoint: "https://api.hoopsync.com"
  api_key: ""
  sync_interval_seconds: 60
  retry_attempts: 3
  timeout_seconds: 30

# Logging
logging:
  level: "INFO"
  file: "logs/hoopsync.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
